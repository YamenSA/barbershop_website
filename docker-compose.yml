services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=barbershop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barbershop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/barbershop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      # Muster B / Same-Origin: Der Browser spricht das Backend NICHT mehr direkt an,
      # sondern über den Same-Origin-Rewrite-Proxy des Frontends. CORS ist damit für den
      # Browser faktisch nicht mehr im Spiel. CORS_ORIGINS trotzdem gesetzt lassen
      # (schadet nicht, deckt Direktzugriffe/Tools ab).
      - CORS_ORIGINS=${CORS_ORIGINS}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - RETENTION_GUEST_MONTHS=12
      - RETENTION_CUSTOMER_MONTHS=12
      - RETENTION_CRON_SECRET=dev-secret-change-in-prod
      # M20: Peers, denen uvicorn X-Forwarded-For vertraut — sonst bleibt uvicorns
      # Default (127.0.0.1) aktiv und die echte Besucher-IP wird nie übernommen
      # (s. docs/analysis/ADMIN_FIX_SPEC.md, M20). Umgebungsabhängig (Coolify
      # verwaltet das Docker-Netz selbst, das tatsächliche Subnetz ist NICHT in
      # diesem Repo fixiert) — deshalb wie CORS_ORIGINS/COOKIE_SECURE von außen
      # gesetzt, nicht hier hartkodiert.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS}
    depends_on:
      db:
        condition: service_healthy
    # M19: Logs sind sonst unbegrenzt (Docker-Default). 10 MB x 3 Dateien pro Container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* wird zur Build-Zeit eingebacken -> relativ (/api/v1) fuer Same-Origin.
        - NEXT_PUBLIC_API_URL=/api/v1
    environment:
      # Ziel des serverseitigen Rewrite-Proxys UND der SSR-Fetches in lib/api.ts
      # (interner Compose-Netz-Name, Port 8000). Runtime-Env, nicht eingebacken.
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    # M19: siehe backend — gleiche Begründung (unbegrenztes Docker-Default-Log).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
